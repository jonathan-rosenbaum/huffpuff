<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sabrina Is — Calm Minimal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eee;
    font-family: -apple-system, system-ui, sans-serif;
    padding: 20px;
  }
  .phone {
    width: 390px;
    height: 844px;
    border-radius: 48px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    background: linear-gradient(165deg, #FDE5EC 0%, #F4DDEB 35%, #E8D5F2 65%, #C9D8F0 100%);
    display: flex;
    flex-direction: column;
    padding: 60px 36px 40px;
    color: #3A2D4A;
    position: relative;
  }
  .status {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 600;
    opacity: 0.7;
    margin-bottom: 32px;
  }
  .brand {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 13px;
    letter-spacing: 6px;
    text-transform: uppercase;
    opacity: 0.55;
    text-align: center;
    margin-bottom: 40px;
  }
  .date {
    text-align: center;
    font-family: Georgia, serif;
    font-size: 14px;
    font-style: italic;
    opacity: 0.55;
    margin-bottom: 80px;
  }
  .affirmation {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .affirmation h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 400;
    font-style: italic;
    font-size: 44px;
    line-height: 1.25;
    letter-spacing: -0.5px;
  }
  .dots { margin-top: 48px; font-size: 14px; opacity: 0.4; letter-spacing: 8px; }
  .cta {
    margin-top: 24px;
    font-family: Georgia, serif;
    font-size: 14px;
    font-style: italic;
    opacity: 0.6;
  }
  .nav {
    display: flex;
    justify-content: space-around;
    padding-top: 24px;
    border-top: 1px solid rgba(58,45,74,0.1);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.55;
  }
  .nav span.active { opacity: 1; font-weight: 600; }
</style>
</head>
<body>
  <div class="phone">
    <div class="status"><span>9:41</span><span>●●●●</span></div>
    <div class="brand">Sabrina Is</div>
    <div class="date">Sunday, April 19</div>
    <div class="affirmation">
      <h1>radiant,<br/>rooted,<br/>&amp; enough.</h1>
      <div class="dots">• • •</div>
      <div class="cta">tap for today's reflection</div>
    </div>
    <div class="nav">
      <span class="active">Today</span>
      <span>Reflect</span>
      <span>Collection</span>
      <span>She</span>
    </div>
  </div>
</body>
</html>
