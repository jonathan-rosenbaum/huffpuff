<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sabrina Is — Aesthetic Previews</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f4f1ea;
    font-family: -apple-system, system-ui, sans-serif;
    padding: 48px 24px;
    color: #222;
  }
  h1 {
    text-align: center;
    font-weight: 300;
    font-size: 32px;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .sub {
    text-align: center;
    color: #777;
    margin-bottom: 48px;
    font-size: 15px;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 40px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    text-align: center;
  }
  .card iframe {
    width: 420px;
    height: 880px;
    border: none;
    border-radius: 52px;
    background: white;
  }
  .card h2 {
    margin-top: 20px;
    font-weight: 500;
    font-size: 18px;
  }
  .card p {
    color: #888;
    font-size: 13px;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <h1>Sabrina Is — pick your aesthetic</h1>
  <p class="sub">Three directions. Open each, then tell me your pick.</p>
  <div class="grid">
    <div class="card">
      <iframe src="1-calm-minimal.html"></iframe>
      <h2>1 · Calm Minimal</h2>
      <p>Soft gradients, serif italics, airy</p>
    </div>
    <div class="card">
      <iframe src="2-bold-modern.html"></iframe>
      <h2>2 · Bold &amp; Modern</h2>
      <p>Dark, confident, high-contrast</p>
    </div>
    <div class="card">
      <iframe src="3-warm-organic.html"></iframe>
      <h2>3 · Warm &amp; Organic</h2>
      <p>Handwritten, paper, journal-cozy</p>
    </div>
  </div>
</body>
</html>
